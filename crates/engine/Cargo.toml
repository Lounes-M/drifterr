[package]
name = "drifterr-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
# Proprietary: never publishable to crates.io. Inherited from the workspace.
publish.workspace = true

[features]
# Off by default. Forwards to the semantic (ONNX) embedder so the eval harness
# can measure detection with real semantics: `cargo run --example eval
# --features onnx` with DRIFTERR_EMBED_MODEL set. Pulls a native runtime, so it
# is opt-in and out of the default build / CI.
onnx = ["drifterr-embeddings/onnx"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
drifterr-tokenizer.workspace = true
drifterr-embeddings.workspace = true

[dev-dependencies]
