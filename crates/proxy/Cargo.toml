[package]
name = "drifterr-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
# Proprietary: never publishable to crates.io. Inherited from the workspace.
publish.workspace = true

[[bin]]
name = "drifterr-proxy"
path = "src/main.rs"

[lib]
name = "drifterr_proxy"
path = "src/lib.rs"

[features]
# Off by default. Turns on the semantic (ONNX) embedder in drifterr-embeddings,
# selected at runtime when DRIFTERR_EMBED_MODEL points at a model dir; otherwise
# it falls back to the local lexical embedder. Pulls a native runtime, so it is
# kept out of the default build / CI. See crates/embeddings/README.md.
semantic = ["drifterr-embeddings/onnx"]

[dependencies]
# io-std: the MCP server's transport *is* stdio, so it needs async stdin.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-std", "io-util"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "http2"] }
futures-util = "0.3"
bytes = "1"
dotenvy = "0.15"
serde.workspace = true
serde_json.workspace = true
drifterr-adapters.workspace = true
drifterr-engine.workspace = true
drifterr-embeddings.workspace = true
drifterr-intervention.workspace = true
drifterr-judge.workspace = true
drifterr-store.workspace = true
drifterr-tokenizer.workspace = true
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
drifterr-judge.workspace = true
drifterr-store.workspace = true
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
