[workspace]
resolver = "2"
members = [
    "crates/adapters",
    "crates/embeddings",
    "crates/engine",
    "crates/intervention",
    "crates/judge",
    "crates/proxy",
    "crates/store",
    "crates/tokenizer",
]
# The Tauri desktop shell is excluded from the workspace: it needs platform GUI
# libraries (webkit2gtk etc.) that aren't present in headless CI, and it pulls a
# large native dependency tree. Build it on a dev machine with `cargo tauri dev`
# from apps/desktop/src-tauri.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
# Single product version — kept in lockstep with the desktop app and the git
# release tag (see RELEASING.md → Versioning). Bump all three together.
version = "0.2.3"
edition = "2021"
license = "LicenseRef-Proprietary"
repository = "https://github.com/lounes-m/drifterr"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"

# Internal crates
drifterr-adapters = { path = "crates/adapters" }
drifterr-embeddings = { path = "crates/embeddings" }
drifterr-engine = { path = "crates/engine" }
drifterr-intervention = { path = "crates/intervention" }
drifterr-judge = { path = "crates/judge" }
drifterr-store = { path = "crates/store" }
drifterr-tokenizer = { path = "crates/tokenizer" }

[profile.release]
lto = true
codegen-units = 1
