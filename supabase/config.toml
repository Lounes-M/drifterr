# Supabase project config (CLI). `project_id` is just a local label; link the
# real project with `supabase link --project-ref <ref>`.
project_id = "drifterr"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# The base URL of your site; used for redirect allow-listing and email links.
site_url = "https://drifterr.app"
additional_redirect_urls = [
  "https://drifterr.app/account",
  "http://localhost:3000",
  "http://localhost:8788",
  "drifterr://auth-callback",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

# OAuth — fill client id/secret via env (SUPABASE_AUTH_EXTERNAL_*).
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[auth.external.github]
enabled = true
client_id = "env(GITHUB_OAUTH_CLIENT_ID)"
secret = "env(GITHUB_OAUTH_CLIENT_SECRET)"

# --- Edge functions ---------------------------------------------------------
# The webhook is called by Stripe, which can't present a Supabase JWT — so it
# must skip JWT verification (the Stripe signature authenticates it instead).
# The others require a logged-in user, so they keep verify_jwt = true.
[functions.stripe-webhook]
verify_jwt = false

[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-portal]
verify_jwt = true

[functions.me]
verify_jwt = true
