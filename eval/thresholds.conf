# Release-gate thresholds for the detection eval (crates/engine/examples/eval.rs).
# One editable place for the numbers. See eval/SCHEMA.md.
#
# Two tiers of enforcement (with `--gate`):
#   • NON-NEGOTIABLES — always block the release, valid on any set. Hard-signal
#     false positives, false REDs, and premature hard alerts are fixed at 0 (not
#     tunable — a hard signal that cries wolf is the one unforgivable failure).
#   • STATISTICAL — auto-become hard gates once the relevant case count reaches
#     `min_cases`; below that they're reported as `n/a (need more cases)` so CI
#     never fails for lack of data. EXCEPTION: `goal.min_recall` gates only the
#     "semantic goal detection" claim/label, never the release itself.
#
# Format: flat `key = number`, one per line. `#` comments and blanks ignored.

min_cases = 30

# Non-negotiable timing: a deterministic hard signal is caught on the turn it
# happens, so the median hard-signal delay must be 0.
hard.max_median_delay = 0

# Soft signals (advisory / AMBER). Looser — a soft miss or a false amber is
# noise, not a trust-killer.
soft.min_precision = 0.60
soft.max_median_delay = 2

# The engine must beat a naive "watch saturation only" detector by this much
# (state-accuracy points). If it can't, the extra signals aren't earning their
# keep — a risk-register red flag.
baseline.min_uplift_pts = 10

# Gates the "semantic goal detection works" claim ONLY (not the release). Below
# this, goal alignment stays labeled best-effort in the UI + README.
goal.min_recall = 0.70
