name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Prints the full detection-quality report (state confusion, per-signal
      # precision/recall/F1, alert delay, uplift vs a saturation-only baseline)
      # AND enforces the release gate: `--gate` fails the build on any
      # hard-signal false positive (a constraint/saturation cause named wrongly,
      # or a false RED). Zero hard false positives is non-negotiable — a hard
      # signal that cries wolf kills trust.
      - name: Detection eval (report + hard-FP gate)
        run: cargo run -q -p drifterr-engine --example eval -- eval/ --gate

  onnx-windows:
    name: ONNX embedder (Windows link check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 1) The DEFAULT (lexical) build must still link on Windows/MSVC with the
      #    `.cargo/config.toml` CRT setting in place — this is the "don't break
      #    the working build" guard.
      - name: Default build (lexical, no onnx)
        run: cargo build -p drifterr-embeddings

      # 2) The real validation: build the semantic embedder AND LINK it into an
      #    executable (the embed_bench example). Building the library alone only
      #    produces an rlib and never links the native objects together, so it
      #    silently missed a CRT mismatch that only the final link exposes (ort's
      #    prebuilt /MD vs a /MT-compiled C/C++ dep → LNK2038). Linking an example
      #    forces the same link the shipped app does. Hard gate — the semantic
      #    model ships by default (release.yml), so a Windows link regression must
      #    fail CI here, before a release build hits it.
      - name: ONNX feature build + link (example executable)
        run: cargo build -p drifterr-embeddings --features onnx --example embed_bench

  desktop-app:
    name: Desktop app (${{ matrix.os }})
    # Both platforms, because "compiles on Linux" was being read as "builds", and
    # it is not. The app's Windows link is otherwise exercised for the first time
    # during a release — which is how `LNK1181: cannot open input file
    # 'bcryptprimitives.lib'` cost three release runs to find instead of one PR.
    # A ~9-minute job here replaces a ~30-minute release cycle as the feedback loop.
    #
    # macOS is deliberately not in this matrix: it bundles rather than merely
    # links, and the release job already proved that path. Windows is the one
    # whose failure mode is invisible until release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Pinned, unlike every other job here, which stays on `stable` on purpose so
      # toolchain drift still surfaces early (that is how clippy 1.98's new lint was
      # found). This one job is different because the app's Windows link broke on a
      # toolchain bump and nothing else in the graph explains it: no crate declares
      # bcryptprimitives without `raw-dylib`, a bare cdylib does not request it, and
      # neither does a cdylib using getrandom. 1.97.0 (2026-07-09) is what v0.2.5
      # shipped a working Windows installer on; every failure has been on 1.98.0
      # (2026-08-18). Bump deliberately, with this job green, not by drifting.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # The tray shell is excluded from the workspace (needs platform GUI libs),
      # so nothing else in CI compiles it — this job is what catches Rust-level
      # breakage in the app before a release build would hit it.
      # THE point of the Windows leg: link the cdylib the release actually builds.
      # `cargo build` is enough — the failure is at link, not at codegen — and it
      # is far cheaper than a full `tauri build`.
      - name: Link the app on Windows
        if: matrix.name == 'windows'
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Clippy the app shell (deny warnings)
        if: matrix.name == 'linux'
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      # The shell was compiled but never *run*, so its logic was unverified.
      # `notification_for` in particular decides whether a user is interrupted,
      # and getting it wrong does not crash anything — it just turns a tool people
      # keep into one they mute, which is a failure nobody files a bug about.
      - name: Test the app shell
        if: matrix.name == 'linux'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Format check the app shell
        if: matrix.name == 'linux'
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

  ui:
    name: Menubar UI (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm test

  extension:
    name: Browser extension (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run parser tests
        run: npm test

  landing:
    name: Landing (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run landing tests
        run: npm test

  # Coverage, reported and not gated.
  #
  # 300+ tests and no idea which signal paths they touch. This codebase tests
  # invariants rather than lines, which is the better instinct — but "we test the
  # right things" is a claim, and it was the only claim here with no number behind
  # it. Reported rather than gated on purpose: a coverage threshold is a target,
  # and a target gets met by testing whatever is cheapest to cover.
  coverage:
    name: Coverage (reported, not gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure
        run: cargo llvm-cov --workspace --summary-only

      # A per-crate line so a drop shows up in the job summary rather than only in
      # a log nobody opens.
      - name: Summarize
        if: always()
        run: |
          cargo llvm-cov --workspace --summary-only >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

  # The billing logic, which sits directly on top of customer money and had no
  # test of any kind — nothing in CI touched supabase/functions/ at all.
  #
  # The two bugs these cover both looked fine on inspection and only appeared
  # under Stripe's real delivery behaviour: a redelivered event applied twice,
  # and an out-of-order `subscription.updated` putting a customer back on the plan
  # they had just upgraded away from. That is precisely the class of defect a test
  # catches and a review does not, which is why the decisions were extracted from
  # the I/O to make them drivable.
  edge-functions:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Type checking is on: these functions are deployed straight from source,
      # so a type error here is a runtime error in production rather than a build
      # failure anywhere.
      - name: Test
        run: deno test --allow-env supabase/functions/

      - name: Lint
        run: deno lint supabase/functions/

      - name: Format check
        run: deno fmt --check supabase/functions/

  # The dependency audit CI never had.
  #
  # 300+ crates and three npm trees reach the shipped product, and nothing checked
  # any of them for advisories, for a licence we cannot ship, or for a source other
  # than crates.io. That is a gap for any project; for one that sells a privacy
  # guarantee it is the wrong gap to have — a compromised transitive dependency in
  # the proxy is a compromised proxy, and the proxy sees every request.
  #
  # Policy lives in `deny.toml`, next to the code, so a decision to accept a licence
  # or an advisory is a reviewed diff rather than a CI flag somebody added at 2am.
  supply-chain:
    name: Dependencies (advisories · licences · sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `--all-features` on purpose: the `onnx` semantic embedder pulls a large
      # native tree that the default build does not, and auditing only the default
      # build would mean the feature we actually ship in release binaries goes
      # unchecked. Duplicate-version findings are warnings (see deny.toml); an
      # advisory, a disallowed licence or an unexpected source fails the build.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The npm trees are devDependencies (Playwright, esbuild) plus the vendored
      # Supabase bundle, so a high-severity finding is worth knowing about even
      # though none of it is shipped to a user. `--omit=dev` would report nothing
      # at all and read as a clean audit.
      - name: npm audit
        run: |
          set -uo pipefail
          fail=0
          for dir in apps/desktop/ui apps/extension apps/landing; do
            echo "--- $dir"
            ( cd "$dir" && npm audit --audit-level=high ) || fail=1
          done
          exit "$fail"

  # Drifterr checking its own pull requests against its own CLAUDE.md.
  #
  # This is the CI mode (`drifterr-proxy check`) dogfooded: the rules the repo already
  # states for its agents become an enforced gate on the diff. If the check is not good
  # enough to run here, it is not good enough to sell.
  #
  # Two sources, deliberately.
  #
  # `--rules CLAUDE.md` is the dogfooding proper: whatever this repo states for its
  # agents becomes a gate on the diff. On its own it currently verifies *nothing* —
  # CLAUDE.md is architectural prose, and none of it is deterministically checkable.
  # That used to be hidden: the old line-based importer manufactured a bogus
  # "server-side only" rule out of a wrapped sentence, so the job reported "1 rule
  # checked" and looked healthy while checking a rule nobody wrote. With the importer
  # fixed the honest count is zero, and `check` exits 2 rather than pretend that is a
  # pass.
  #
  # So the job also carries `--pack security-basics`, one of our own shipped packs.
  # Its no-hardcoded-secrets rule is real value on every PR, and it means the step
  # verifies something rather than reporting an empty run. As CLAUDE.md gains
  # checkable rules they simply join in.
  #
  # `--warn-only` for now: the rule set is small and the repo predates it, so blocking
  # every PR on day one would just get the job deleted. Drop the flag once the rules have
  # earned it.
  self-check:
    name: Drifterr rule check (self)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the checker
        run: cargo build --quiet --release -p drifterr-proxy --bin drifterr-proxy

      - name: Check this diff against CLAUDE.md
        run: |
          set -uo pipefail
          BASE="${GITHUB_BASE_REF:-}"
          if [ -n "$BASE" ]; then
            git fetch --quiet origin "$BASE"
            git diff "origin/$BASE"... > diff.patch
          else
            git diff HEAD~1 > diff.patch || : > diff.patch
          fi
          # Fenced, because the engine scopes code rules to fenced blocks — a filename in
          # prose must never count as touching that file.
          { echo '```diff'; cat diff.patch; echo '```'; } \
            | ./target/release/drifterr-proxy check \
                --rules CLAUDE.md \
                --pack security-basics \
                --warn-only

  # Parse the workflow files themselves.
  #
  # This exists because release.yml shipped invalid and nothing noticed. It only
  # triggers on a tag, so CI never parsed it: the error (`secrets` referenced from
  # a step-level `if:`, where that context is not available) surfaced for the first
  # time as a failed release, on the one run where a broken workflow costs the most.
  #
  # actionlint parses every file under .github/workflows and checks the things
  # GitHub only checks at dispatch time — expression syntax, context availability
  # per position, action inputs, shell quoting. A workflow that never runs on a PR
  # is exactly the one worth linting on every PR.
  workflows:
    name: Workflow files (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        # Pinned rather than floating: a lint that silently changes its rules
        # between runs turns a green PR red for reasons nobody changed.
        #
        # actionlint shells out to `shellcheck` for every `run:` block and skips
        # that half silently when the binary is absent. GitHub's runners ship it,
        # so a local run without shellcheck installed is NOT this check — it is
        # the weaker half of it, and it will tell you a file is clean that CI
        # then rejects. Install shellcheck before trusting a local pass.
        run: |
          set -euo pipefail
          VERSION=1.7.7
          curl -sSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          tar xzf actionlint.tar.gz actionlint
          # No path argument: actionlint discovers .github/workflows itself. Passing
          # .github/actions/*/action.yml would be wrong — an action definition is not
          # a workflow, and actionlint rightly rejects it as one.
          ./actionlint -color
