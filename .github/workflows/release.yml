name: Release

# Build the desktop app (proxy + menubar fused into one binary) and attach the
# installers to a GitHub release. Triggered by pushing a version tag, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
#
# NOTE: this builds the Tauri app, which is excluded from the normal CI (it needs
# platform GUI libraries). Verify/adjust on the first real release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"
      semantic:
        description: "Bundle the ONNX semantic model (true = real semantic detection, +~130MB)"
        type: boolean
        required: false
        default: true

jobs:
  release:
    permissions:
      contents: write
    # Semantic ON by default: tag pushes always build the semantic app; a manual
    # run can opt out by unchecking the input (falls back to the lexical build if
    # the ONNX path ever misbehaves — no workflow edit needed).
    env:
      SEMANTIC: ${{ github.event_name != 'workflow_dispatch' || inputs.semantic }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS binary — runs natively on Apple silicon AND Intel.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Download the ONNX sentence-transformer onto the runner (gitignored, never
      # committed) so it can be bundled as a Tauri resource. curl ships on every
      # GitHub runner incl. Windows; the script writes into src-tauri/models/embed.
      - name: Fetch semantic model
        if: env.SEMANTIC == 'true'
        shell: bash
        run: bash apps/desktop/scripts/fetch-model.sh

      # Final build args = per-platform target (+ the semantic feature and the
      # resource-injecting config overlay when semantic is on). Keeps the
      # committed tauri.conf.json untouched — the overlay only adds the model
      # resource for this build.
      - name: Assemble build args
        id: buildargs
        shell: bash
        run: |
          ARGS="${{ matrix.args }}"
          if [ "$SEMANTIC" = "true" ]; then
            ARGS="$ARGS --features semantic --config semantic.conf.json"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — REQUIRED (createUpdaterArtifacts is on).
          # Set these two repo secrets (see RELEASING.md). The password secret may
          # be empty if the key was generated without one.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- macOS code signing + notarization ---------------------------------
          # Turnkey: these resolve to empty strings until you add the secrets, and
          # tauri-action skips signing when APPLE_CERTIFICATE is empty (so builds
          # stay unsigned, exactly as before). The moment you add the six secrets
          # (see RELEASING.md), the macOS build is signed AND notarized — no
          # further workflow change. Only the macos job reads these.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ inputs.version || github.ref_name }}
          releaseName: "Drifterr ${{ inputs.version || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ steps.buildargs.outputs.args }}
