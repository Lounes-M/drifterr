name: Release

# Build the desktop app (proxy + menubar fused into one binary) and attach the
# installers to a GitHub release. Triggered by pushing a version tag, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
#
# NOTE: this builds the Tauri app, which is excluded from the normal CI (it needs
# platform GUI libraries). Verify/adjust on the first real release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build (e.g. v0.3.0)"
        required: true
        default: "v0.3.0"
      bundle_semantic:
        description: "Bundle the ~127MB semantic ONNX model in the installer. Normally OFF — the app fetches it on demand when the user asks."
        type: boolean
        required: false
        default: false

jobs:
  release:
    permissions:
      contents: write
    # The semantic (ONNX) model is NOT bundled by default any more.
    #
    # It was ~127 MB of every installer and every update, paid by every user, to feed
    # the signal that fires least often — and since the goal signal's thresholds became
    # scale-free (relative rather than an absolute cosine floor), the lexical embedder
    # detects the eval set's goal-drift case on its own. That made bundling the most
    # expensive default in the product for the least certain gain.
    #
    # The app now fetches the model on demand, verified against a pinned checksum, when
    # a user asks for semantic similarity. Set `bundle_semantic` on a manual run to
    # produce a pre-bundled installer anyway (useful for offline/air-gapped installs).
    env:
      SEMANTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_semantic }}
    strategy:
      fail-fast: false
      # Build platforms ONE AT A TIME. tauri-action merges each job's platform
      # into the release's shared latest.json by read-modify-write; running the
      # three jobs in parallel races on that file and silently drops a platform
      # (v0.2.1 shipped a latest.json with NO macOS entry, so every Mac's
      # in-app update check failed). Sequential builds merge cleanly. macOS is
      # first in the matrix, so it seeds latest.json before the others append.
      max-parallel: 1
      matrix:
        include:
          # One universal macOS binary — runs natively on Apple silicon AND Intel.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Download the ONNX sentence-transformer onto the runner (gitignored, never
      # committed) so it can be bundled as a Tauri resource. curl ships on every
      # GitHub runner incl. Windows; the script writes into src-tauri/models/embed.
      - name: Fetch semantic model
        if: env.SEMANTIC == 'true'
        shell: bash
        run: bash apps/desktop/scripts/fetch-model.sh

      # Final build args = per-platform target (+ the semantic feature and the
      # resource-injecting config overlay when semantic is on). Keeps the
      # committed tauri.conf.json untouched — the overlay only adds the model
      # resource for this build.
      # --- code signing -------------------------------------------------------
      #
      # Unsigned builds are the single worst thing in the install funnel: macOS
      # says "Drifterr is damaged and can't be opened" and Windows hides the
      # install button, so a large share of downloads never reach first launch.
      #
      # Signing therefore runs whenever the certificates are present, and the
      # build still succeeds without them (shipping unsigned, exactly as before)
      # so a missing secret can never block a release.
      #
      # Why we import the macOS certificate ourselves instead of handing
      # APPLE_CERTIFICATE to tauri-action: tauri-action treats the variable as
      # "signing requested" if it is merely *defined*, so an empty value made it
      # run `security import` on nothing and fail the whole macOS build. Doing the
      # import here means the variable is either a real certificate or absent.
      - name: Detect signing material
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          mac=false; notarize=false; win=false
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then mac=true; fi
          if [ "$mac" = true ] && [ -n "$APPLE_ID" ]; then notarize=true; fi
          if [ -n "$WINDOWS_CERTIFICATE" ]; then win=true; fi
          {
            echo "mac=$mac"
            echo "notarize=$notarize"
            echo "win=$win"
          } >> "$GITHUB_OUTPUT"
          echo "macOS signing: $mac (notarize: $notarize) · Windows signing: $win"

      - name: Import macOS signing certificate
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.mac == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/drifterr-signing.keychain-db"
          # A throwaway password for a throwaway keychain on an ephemeral runner.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Keep the login keychain in the search list so system roots still resolve.
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Stage Windows signing certificate
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.win == 'true'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          set -euo pipefail
          echo -n "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/drifterr.pfx"
          # Path is consumed by windows-sign.conf.json's signCommand.
          echo "WINDOWS_CERTIFICATE_PATH=$RUNNER_TEMP/drifterr.pfx" >> "$GITHUB_ENV"

      - name: Assemble build args
        id: buildargs
        shell: bash
        run: |
          ARGS="${{ matrix.args }}"
          if [ "$SEMANTIC" = "true" ]; then
            ARGS="$ARGS --features semantic --config semantic.conf.json"
          fi
          # Windows Authenticode is applied during bundling (so the app binary and
          # the installer are both signed) via a config overlay, added only when a
          # certificate is actually available.
          if [ "${{ matrix.platform }}" = "windows-latest" ] && [ "${{ steps.signing.outputs.win }}" = "true" ]; then
            ARGS="$ARGS --config windows-sign.conf.json"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — REQUIRED (createUpdaterArtifacts is on).
          # Set these two repo secrets (see RELEASING.md). The password secret may
          # be empty if the key was generated without one.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- entitlement verification ------------------------------------------
          # The PUBLIC half of the key the accounts backend signs plan assertions
          # with. `plan_token.rs` reads it via `option_env!`, so it is baked in at
          # COMPILE time — which means a release built without it verifies nothing
          # and silently falls back to trusting whatever plan the panel asserts.
          # That is exactly the state the signing work was meant to end, so the
          # variable belongs here rather than in a runbook step somebody follows.
          #
          # Unset is a supported state (self-hosters, a fork): the build then
          # reports `"verified": false` at GET /entitlement rather than pretending.
          # The "Warn when entitlements are unverified" step below makes that loud.
          DRIFTERR_ENTITLEMENT_PUBKEY: ${{ secrets.DRIFTERR_ENTITLEMENT_PUBKEY }}
          # --- macOS code signing + notarization ---------------------------------
          # The certificate is already in a runner keychain (see "Import macOS
          # signing certificate"), so tauri-action only needs the identity to sign
          # with. Note APPLE_CERTIFICATE is deliberately NOT passed: tauri-action
          # treats it as "signing requested" whenever it is defined, so an empty
          # value made it `security import` nothing and fail the macOS build.
          #
          # Every value below resolves to "" when the corresponding secret is
          # unset, which is how tauri-action is told to skip signing/notarization —
          # so a repo with no certificates still produces a working (unsigned)
          # release rather than a failed one.
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.mac == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ steps.signing.outputs.notarize == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ steps.signing.outputs.notarize == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.notarize == 'true' && secrets.APPLE_TEAM_ID || '' }}
          # Consumed by windows-sign.conf.json's signCommand (set by the staging
          # step above; empty when no Windows certificate is configured).
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ inputs.version || github.ref_name }}
          releaseName: "Drifterr ${{ inputs.version || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ steps.buildargs.outputs.args }}

      # Prove the signature is real rather than assuming the build did it. A
      # silently-unsigned release is exactly the failure we're trying to end, and
      # it is invisible until a user reports "damaged and can't be opened".
      - name: Verify macOS signature and notarization
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.mac == 'true'
        run: |
          set -euo pipefail
          APP=$(find apps/desktop/src-tauri/target -type d -name "Drifterr.app" -print -quit)
          if [ -z "$APP" ]; then echo "::error::built .app not found"; exit 1; fi
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "${{ steps.signing.outputs.notarize }}" = "true" ]; then
            # The real test: Gatekeeper's own assessment, which is what a user hits.
            spctl --assess --type execute --verbose=4 "$APP"
            echo "Notarized and accepted by Gatekeeper."
          else
            echo "::warning::Signed but NOT notarized — macOS will still warn on first launch. Add APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID."
          fi

      # Same principle as the unsigned-build warning below: a release that cannot
      # verify entitlements is a deliberate choice, not something nobody noticed.
      #
      # The emptiness test is inside the script rather than in `if:` because the
      # `secrets` context is not available to a step-level condition — GitHub
      # rejects the whole file with "Unrecognized named-value: 'secrets'", which
      # is how this shipped broken: release.yml only runs on a tag, so nothing
      # ever parsed it until the first release attempt. Reading the secret through
      # `env` is the supported way to get at it here.
      - name: Warn when entitlements are unverified
        env:
          ENTITLEMENT_PUBKEY: ${{ secrets.DRIFTERR_ENTITLEMENT_PUBKEY }}
        shell: bash
        run: |
          if [ -z "$ENTITLEMENT_PUBKEY" ]; then
            echo "::warning title=Unverified entitlements::DRIFTERR_ENTITLEMENT_PUBKEY is unset, so this build accepts whatever plan the panel asserts and reports \"verified\": false. See docs/ACCOUNTS.md."
          else
            echo "Entitlement verification is compiled in."
          fi

      # Make the "we're unsigned" state loud in the build log, so it's a deliberate
      # choice each release rather than something nobody noticed. The matching
      # warning on drifterr.app/download must stay up while this fires.
      - name: Warn when shipping unsigned
        if: |
          (matrix.platform == 'macos-latest' && steps.signing.outputs.mac != 'true') ||
          (matrix.platform == 'windows-latest' && steps.signing.outputs.win != 'true')
        shell: bash
        run: |
          echo "::warning title=Unsigned build::${{ matrix.platform }} artifacts are UNSIGNED. Users will hit an OS warning on first launch. See RELEASING.md → Signing and notarization for the secrets to add; keep the first-launch notice on drifterr.app/download until this stops appearing."

      # Runner keychains and PFX files are ephemeral, but a cancelled job can leave
      # them behind on a self-hosted runner. `if: always()` so a failed build still
      # cleans up its key material.
      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/drifterr.pfx" "$RUNNER_TEMP/cert.p12" || true
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            security delete-keychain "$RUNNER_TEMP/drifterr-signing.keychain-db" 2>/dev/null || true
          fi

  # Publish SHA256SUMS for the release's assets.
  #
  # `install.sh` downloads a DMG or AppImage over HTTPS and runs it. TLS proves it
  # came from GitHub; it proves nothing about whether the bytes are the ones we
  # built. `packaging/checksums.sh` already existed to hash assets by hand for the
  # Homebrew and winget manifests, so the digests were computed and then not
  # published — which meant the installer had nothing to verify against.
  #
  # Runs after every platform has uploaded, and needs the release to still be a
  # draft so the file lands before anyone can download from it.
  checksums:
    name: Publish SHA256SUMS
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Hash every asset and attach the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          # `--pattern '*'` would also pull latest.json and any .sig; those are part
          # of the release too, and hashing them costs nothing and documents more.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          # Never hash a previous manifest into the new one.
          rm -f SHA256SUMS
          # `-- *` rather than `./*`: install.sh matches this manifest on the bare
          # filename (`$2 == n`), so a `./` prefix would be listed under a name it
          # never looks up and every download would fail verification.
          sha256sum -- * > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
