name: Deploy landing

# Publishes apps/landing to GitHub Pages on every push to main. Works with a
# custom domain: once you've bought one, add a file apps/landing/CNAME containing
# the domain (e.g. drifterr.app) and set it in repo Settings → Pages.

on:
  push:
    branches: [main]
    paths: ["apps/landing/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing
      - id: deploy
        uses: actions/deploy-pages@v4
