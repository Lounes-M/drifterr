<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; width: 260px;
        font: 400 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #fff; background: #16151f;
      }
      .wrap { padding: 16px; }
      .row { display: flex; align-items: center; gap: 10px; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: #6f6d82; flex: 0 0 auto; }
      .dot.green { background: #34e89e; }
      .dot.amber { background: #ffb23e; }
      .dot.red { background: #ff4d6d; }
      h1 { margin: 0; font-size: 15px; font-weight: 700; }
      .sub { margin: 2px 0 0; color: #a3a1b4; font-size: 12px; }
      .detail { margin: 10px 0 0; color: #c9c8d4; font-size: 12px; overflow-wrap: anywhere; }
      .btn {
        display: block; width: 100%; margin-top: 14px; padding: 9px 0;
        text-align: center; text-decoration: none; color: #fff; font-weight: 600;
        border-radius: 10px; background: linear-gradient(90deg, #ff7847, #ff3d81);
      }
      .off { color: #86849a; font-size: 12px; margin-top: 8px; }
      .pair { margin-top: 12px; }
      .pair-help { margin: 0 0 8px; color: #a3a1b4; font-size: 11.5px; line-height: 1.45; }
      .pair-row { display: flex; gap: 6px; }
      .pair-row input {
        flex: 1 1 auto; min-width: 0; padding: 7px 8px; font: inherit; font-size: 12px;
        color: #fff; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
        border-radius: 8px;
      }
      .pair-row input:focus-visible { outline: 2px solid #ff7847; outline-offset: 1px; }
      .pair-row button {
        flex: 0 0 auto; padding: 7px 12px; font: inherit; font-size: 12px; font-weight: 600;
        color: #fff; background: #3a3850; border: 0; border-radius: 8px; cursor: pointer;
      }
      .pair-row button:hover { background: #494764; }
      .pair-row button:focus-visible { outline: 2px solid #ff7847; outline-offset: 1px; }
      .health {
        margin: 10px 0 0; padding: 8px 10px; border-radius: 8px; font-size: 11.5px;
        line-height: 1.45; background: rgba(255,255,255,.06); color: #a3a1b4;
      }
      /* A broken scraper is a loud state, not a footnote: the user needs to know
         drift is not being tracked at all on this page. */
      .health.broken {
        background: rgba(255,77,109,.14); border: 1px solid rgba(255,77,109,.4);
        color: #ffb3c1;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="row">
        <span id="dot" class="dot" aria-hidden="true"></span>
        <div>
          <h1 id="state">Connecting…</h1>
          <p id="sub" class="sub">Reading your session.</p>
        </div>
      </div>
      <p id="detail" class="detail" hidden></p>
      <!--
        Scraper health. Without this, a site redesign that breaks our selectors is
        indistinguishable from "no drift" — the worst possible failure mode for a
        monitoring tool, because it looks like everything is fine.
      -->
      <p id="health" class="health" hidden></p>
      <p id="off" class="off" hidden>Start the Drifterr app (or run the proxy) to see live status.</p>
      <!--
        Pairing. The control API is authenticated so that a website cannot read
        the user's sessions out of it; the extension is the one consumer Drifterr
        does not launch, so it is paired by hand, once.
      -->
      <form id="pair" class="pair" hidden>
        <p class="pair-help">
          Paste the pairing token from the Drifterr panel
          (Settings &rarr; Browser extension) to connect.
        </p>
        <div class="pair-row">
          <input
            id="pair-token"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="Pairing token"
            aria-label="Drifterr pairing token"
          />
          <button type="submit">Connect</button>
        </div>
      </form>
      <a class="btn" href="http://localhost:8788/" target="_blank" rel="noopener">Open panel</a>
    </div>
    <script src="api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
