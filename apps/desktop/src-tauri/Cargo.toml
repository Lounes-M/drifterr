[package]
name = "drifterr-desktop"
version = "0.3.0"
edition = "2021"
description = "Drifterr menubar app"
license = "MIT"
# Standalone — intentionally NOT part of the root workspace (see root Cargo.toml).

[lib]
name = "drifterr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Off by default. Ships the semantic (ONNX) embedder: build with
# `cargo tauri build --features semantic` and bundle a model dir (see
# scripts/fetch-model.sh + tauri.conf.json resources). Without it — and without
# a model present — the app runs on the local lexical embedder, unchanged.
semantic = ["drifterr-proxy/semantic"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The embedded local proxy (fusion: one binary runs proxy + menubar).
drifterr-proxy = { path = "../../../crates/proxy" }
