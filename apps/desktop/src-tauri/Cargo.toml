[package]
name = "drifterr-desktop"
version = "0.1.1"
edition = "2021"
description = "Drifterr menubar app"
license = "MIT"
# Standalone — intentionally NOT part of the root workspace (see root Cargo.toml).

[lib]
name = "drifterr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The embedded local proxy (fusion: one binary runs proxy + menubar).
drifterr-proxy = { path = "../../../crates/proxy" }
