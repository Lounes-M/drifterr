<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Drifterr</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
    <script src="config.js"></script>
  </head>
  <body>
    <div class="bg" aria-hidden="true"><span class="blob b1" data-depth="18"></span><span class="blob b2" data-depth="-22"></span></div>
    <a class="back-link" href="/">← Back to drifterr</a>

    <div class="auth-wrap">
      <div class="auth-card">
        <a class="brand" href="/">
          <span class="mark"><span class="fill"></span><span class="ring"></span></span>
          <b>drifterr</b>
        </a>
        <h1>Welcome back</h1>
        <p class="sub">Sign in to manage your plan.</p>

        <div id="msg" class="auth-msg" hidden></div>

        <form id="form">
          <label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" required /></label>
          <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required /></label>
          <button class="btn btn-lg btn-full" type="submit" id="submit">Sign in</button>
        </form>

        <div class="divider">or</div>
        <div class="oauth">
          <button type="button" data-provider="google">Continue with Google</button>
          <button type="button" data-provider="github">Continue with GitHub</button>
        </div>

        <p class="auth-alt">No account yet? <a id="signup-link" href="/signup">Create one</a></p>
      </div>
    </div>

    <script type="module">
      import { supabase, configured, signInWithProvider, qp } from "./supabase.js";

      const msg = document.getElementById("msg");
      const show = (text, kind) => { msg.hidden = false; msg.className = "auth-msg " + kind; msg.textContent = text; };

      const plan = qp("plan"), interval = qp("interval") || "year";
      if (plan) {
        localStorage.setItem("drifterr_pending_checkout", JSON.stringify({ plan, interval }));
        const su = document.getElementById("signup-link");
        if (su) su.href = `/signup?plan=${plan}&interval=${interval}`;
      }

      if (!configured) show("Accounts aren't enabled yet — you can still download Drifterr for free.", "info");

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!configured) { window.location.href = "/download"; return; }
        const btn = document.getElementById("submit");
        btn.disabled = true; btn.textContent = "Signing in…";
        try {
          const { error } = await supabase.auth.signInWithPassword({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          });
          if (error) throw error;
          window.location.href = "/account";
        } catch (err) {
          show(err.message || "Could not sign in.", "error");
          btn.disabled = false; btn.textContent = "Sign in";
        }
      });

      document.querySelectorAll(".oauth button").forEach((b) =>
        b.addEventListener("click", () => {
          if (!configured) { window.location.href = "/download"; return; }
          signInWithProvider(b.dataset.provider, "/account").catch((e) => show(e.message, "error"));
        })
      );
    </script>
  </body>
</html>
